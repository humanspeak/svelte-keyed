# Test workflow managed by humanspeak/svelte-diff shared release source
name: Run tests

permissions:
    contents: read

on:
    workflow_call:
    pull_request:
        branches: [main]
        paths:
            - src/**
            - tests/**
            - package.json
            - package-lock.json
            - tsconfig*.json
            - svelte.config.*
            - vite.config.*
            - vitest.config.*
            - .github/scripts/**
            - .github/release-policy.json
            - .github/release-source.json
            - .github/workflows/run-tests.yml
            - vitest.setup.*
            - playwright.config.*
            - eslint.config.*
            - .npmrc

concurrency:
    group: run-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20, 22]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install
              run: npm ci
            - name: Check library types
              run: npm run check
            - name: Test release safety offline
              run: node --test .github/scripts/*.test.mjs
            - name: Build and test
              run: |
                  npm run build
                  npm run test
